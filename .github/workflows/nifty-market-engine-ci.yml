name: NIFTY Market Engine CI

on:
  push:
    paths: ['projects/nifty-market-engine/**', '.github/workflows/nifty-market-engine-ci.yml']
  pull_request:
    paths: ['projects/nifty-market-engine/**', '.github/workflows/nifty-market-engine-ci.yml']

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/nifty-market-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install pytest
      - run: PYTHONPATH=src python scripts/check_config.py
      - run: PYTHONPATH=src python -m compileall -q src
      - run: PYTHONPATH=src python -m pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/nifty-market-engine/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm install --no-audit --no-fund
      - run: npm run build
